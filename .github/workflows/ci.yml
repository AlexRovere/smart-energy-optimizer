name: CI

# Le pipeline agit comme un sas : lint, tests, puis scan de sécurité bloquant,
# puis build. Un filtrage par chemin évite de tout rejouer à chaque commit,
# ce qui est l'intérêt d'un monorepo bien câblé.
#
# Le scan de sécurité vit dans security.yml, qui tourne aussi sur push pour
# ne pas attendre l'ouverture d'une pull request.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Le jeton est restreint explicitement, donc tout ce qui n'est pas listé ici est
# refusé. paths-filter interroge l'API des fichiers modifiés quand l'événement
# est une pull request, d'où pull-requests: read. Sans cette ligne le job
# changes échoue en « Resource not accessible by integration », et comme il
# conditionne tous les autres, c'est tout le pipeline qui ne tourne pas.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Détermine quels domaines ont changé : les jobs suivants s'y conditionnent.
  changes:
    runs-on: ubuntu-latest
    outputs:
      etl: ${{ steps.filter.outputs.etl }}
      ml: ${{ steps.filter.outputs.ml }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            etl:
              - 'apps/etl/**'
            ml:
              - 'apps/ml/**'
            dashboard:
              - 'apps/dashboard/**'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'

  etl:
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Le cache pip se réactive avec requirements.txt : il en calcule sa clé,
      # et sans le fichier l'action échoue avant même le premier TODO.
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # TODO : décommenter dès que les dépendances existent, cache compris.
      #   with: { python-version: "3.12", cache: pip }
      # - run: pip install -r apps/etl/requirements.txt
      # - run: ruff check apps/etl
      # - run: pytest apps/etl --cov=apps/etl --cov-fail-under=80
      - run: echo "TODO ETL - lint et tests unitaires, dont la gestion des null et de data_quality"

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # TODO : décommenter dès que les dépendances existent, cache compris.
      #   with: { python-version: "3.12", cache: pip }
      # - run: pip install -r apps/ml/requirements.txt
      # - run: ruff check apps/ml
      # - run: pytest apps/ml
      - run: echo "TODO ML - lint et tests du contrat de l API de prediction"

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # package-manager-cache: false coupe le cache automatique introduit en v5,
      # qui s'active seul dès qu'un package.json porte un champ packageManager
      # et échouerait faute de lockfile, comme le cache explicite retiré juste
      # avant. Les deux se rallument ensemble.
      - uses: actions/setup-node@v7
        with: { node-version: 20, package-manager-cache: false }
      # TODO : décommenter dès que pnpm-lock.yaml existe, cache compris.
      # - uses: pnpm/action-setup@v4
      #   with: { version: 9 }
      #   with: { node-version: 20, cache: pnpm, cache-dependency-path: apps/dashboard/pnpm-lock.yaml }
      # - run: pnpm --dir apps/dashboard install --frozen-lockfile
      # - run: pnpm --dir apps/dashboard lint
      # - run: pnpm --dir apps/dashboard test
      # - run: pnpm --dir apps/dashboard build
      - run: echo "TODO dashboard - lint, tests et build"

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Terraform est passé hors périmètre au J1 : plus de ressource de
      # fournisseur à créer, la machine est fournie. Ce job valide désormais la
      # configuration Ansible et la composition. TODO : décommenter dès que le
      # playbook et les Dockerfile existent.
      # - run: pipx install ansible-lint && ansible-lint infra/ansible
      # - run: docker compose config --quiet
      - run: echo "TODO infra - ansible-lint du playbook et validation de la composition"
