[project]
name = "etl"
version = "0.1.0"
description = "Ingestion du référentiel des sites depuis l'API Mock IoT vers Parquet et PostgreSQL"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==2.2.3",
    "psycopg2-binary==2.9.10",
    "pyarrow==23.0.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[dependency-groups]
# Hors de l'image : le Dockerfile installe avec --no-dev.
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
package = false

# Mise en page plate (pas de src/) : on mesure tout le répertoire, sauf les
# tests eux-mêmes, qui gonfleraient le taux sans rien dire du code.
[tool.coverage.run]
source = ["."]
omit = ["test/*"]
