name: Sécurité

# security et secrets tournent sur tout push, y compris hors pull request :
# un secret ne doit pas dormir jusqu'à l'ouverture d'une PR. Voir ci.yml
# pour le reste du pipeline, lié aux pull requests pour le coût.
#
# Pas de déclencheur pull_request ici, volontairement : les checks restent
# attachés au commit, pas à l'événement qui les a lancés (vérifié via l'API
# check-runs), donc un run push apparaît déjà sur la pull request. Ajouter
# pull_request déclencherait un doublon sur le même commit, et le
# concurrency ne fait qu'annuler l'un des deux : le check annulé reste
# affiché en échec sur la PR, à jamais. Deux limites à connaître avant de
# rétablir ce déclencheur : un run pull_request analyse le résultat de la
# fusion, pas la pointe de la branche (sans portée pour ce que ces jobs
# scannent) ; et une pull request venant d'un fork ne déclenche pas
# d'événement push dans le dépôt d'origine (sans objet ici, dépôt privé
# sans fork).

on:
  push:
    branches: ["**"]

# cancel-in-progress simple : un seul événement déclenche ce workflow, donc
# l'annulation ne porte que sur un push dépassé par un plus récent sur la
# même branche, jamais sur un doublon avec une pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Quality gate : ce job tourne sur TOUTE modification et bloque à la première
  # vulnérabilité critique. C'est le critère DevSecOps de l'épreuve EC03.
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Historique complet, sans quoi gitleaks ne verrait que le dernier commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }

      # Trivy couvre les trois angles en un passage : vulnérabilités des
      # dépendances, secrets versionnés, et mauvaises configurations (Terraform,
      # Dockerfile, Compose). exit-code 1 rend le job bloquant. Il ne voit que
      # l'arbre de travail : gitleaks, ci-dessous, couvre l'historique.
      - name: Scan de sécurité (Trivy)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # -m compare aussi chaque fusion à ses parents (git log ne montre pas
      # leur contenu par défaut), sans quoi un secret introduit en résolvant
      # un conflit passerait au travers.
      #
      # C'est le binaire qui est utilisé, sous licence MIT. Seule l'action
      # gitleaks v2 exige une licence payante pour les organisations, ce qui
      # avait conduit à l'écarter ; la distinction manquait ici.
      #
      # Job sans secret : enjeu moindre qu'avec sops, mais la somme est
      # aussi simple à vérifier ici que là.
      - name: Scan de l'historique (gitleaks)
        run: |
          curl --proto '=https' --proto-redir '=https' -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          gitleaks git . --log-opts="--all -m --full-history" --redact --exit-code 1

  # Le risque n'est pas le chiffrement mais l'oubli : un .sops.yaml pas à jour
  # après rechiffrement perd un destinataire, invisible avant le déploiement.
  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      # Lu sans déchiffrer : SOPS ne chiffre que les valeurs, pas les clés.
      - name: Les destinataires du fichier sont ceux déclarés
        run: |
          grep -oE 'age1[0-9a-z]{58}' .sops.yaml       | sort -u > attendus.txt
          grep -oE 'age1[0-9a-z]{58}' secrets.enc.yaml | sort -u > effectifs.txt
          diff attendus.txt effectifs.txt

      # Somme publiée par le projet sops pour cette release exacte : le
      # téléchargement épinglait la version, pas le contenu.
      - name: Installer sops
        run: |
          curl --proto '=https' --proto-redir '=https' -sSfL https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64 -o /usr/local/bin/sops
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /usr/local/bin/sops" | sha256sum -c -
          chmod +x /usr/local/bin/sops

      # Sortie jetée : on vérifie que ça déchiffre, jamais ce que ça contient.
      - name: Le fichier est déchiffrable par la CI
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt secrets.enc.yaml > /dev/null
