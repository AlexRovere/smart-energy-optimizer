[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.5.5",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "prophet>=1.4.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tornado<6.5.9",
]

[project.scripts]
ml = "ml:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
