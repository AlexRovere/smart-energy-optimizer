name: CI

# Le pipeline agit comme un sas : lint, tests, puis scan de sécurité bloquant,
# puis build. Un filtrage par chemin évite de tout rejouer à chaque commit,
# ce qui est l'intérêt d'un monorepo bien câblé.
#
# security et secrets tournent sur tout push (un secret ne doit pas dormir
# jusqu'à l'ouverture d'une pull request) ; le reste reste lié aux pull
# requests vers main, pour le coût, l'organisation étant en offre gratuite
# et plafonnée.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Une pull request ouverte déclenche push et pull_request pour le même
# commit, donc security/secrets tourneraient deux fois sans ce groupe. La
# clé (nom de branche) est la même dans les deux événements pour qu'ils se
# retrouvent dans le même groupe. cancel-in-progress ne vaut que pour
# pull_request : leur ordre d'arrivée n'est pas garanti, et un push ne doit
# jamais pouvoir annuler une exécution pull_request déjà lancée (qui porte
# aussi changes/etl/ml/dashboard/infra) au profit d'un doublon plus léger.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Le jeton est restreint explicitement, donc tout ce qui n'est pas listé ici est
# refusé. paths-filter interroge l'API des fichiers modifiés quand l'événement
# est une pull request, d'où pull-requests: read. Sans cette ligne le job
# changes échoue en « Resource not accessible by integration », et comme il
# conditionne tous les autres, c'est tout le pipeline qui ne tourne pas.
permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # Détermine quels domaines ont changé : les jobs suivants s'y conditionnent.
  # Restreint aux pull requests : sur un push de branche, ce job est ignoré,
  # et etl/ml/dashboard/infra le sont avec lui (needs d'un job ignoré = ignoré).
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      etl: ${{ steps.filter.outputs.etl }}
      ml: ${{ steps.filter.outputs.ml }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            etl:
              - 'apps/etl/**'
            ml:
              - 'apps/ml/**'
            dashboard:
              - 'apps/dashboard/**'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'

  etl:
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Le cache pip se réactive avec requirements.txt : il en calcule sa clé,
      # et sans le fichier l'action échoue avant même le premier TODO.
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # TODO : décommenter dès que les dépendances existent, cache compris.
      #   with: { python-version: "3.12", cache: pip }
      # - run: pip install -r apps/etl/requirements.txt
      # - run: ruff check apps/etl
      # - run: pytest apps/etl --cov=apps/etl --cov-fail-under=80
      - run: echo "TODO ETL - lint et tests unitaires, dont la gestion des null et de data_quality"

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      # TODO : décommenter dès que les dépendances existent, cache compris.
      #   with: { python-version: "3.12", cache: pip }
      # - run: pip install -r apps/ml/requirements.txt
      # - run: ruff check apps/ml
      # - run: pytest apps/ml
      - run: echo "TODO ML - lint et tests du contrat de l API de prediction"

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # package-manager-cache: false coupe le cache automatique introduit en v5,
      # qui s'active seul dès qu'un package.json porte un champ packageManager
      # et échouerait faute de lockfile, comme le cache explicite retiré juste
      # avant. Les deux se rallument ensemble.
      - uses: actions/setup-node@v7
        with: { node-version: 20, package-manager-cache: false }
      # TODO : décommenter dès que pnpm-lock.yaml existe, cache compris.
      # - uses: pnpm/action-setup@v4
      #   with: { version: 9 }
      #   with: { node-version: 20, cache: pnpm, cache-dependency-path: apps/dashboard/pnpm-lock.yaml }
      # - run: pnpm --dir apps/dashboard install --frozen-lockfile
      # - run: pnpm --dir apps/dashboard lint
      # - run: pnpm --dir apps/dashboard test
      # - run: pnpm --dir apps/dashboard build
      - run: echo "TODO dashboard - lint, tests et build"

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Terraform est passé hors périmètre au J1 : plus de ressource de
      # fournisseur à créer, la machine est fournie. Ce job valide désormais la
      # configuration Ansible et la composition. TODO : décommenter dès que le
      # playbook et les Dockerfile existent.
      # - run: pipx install ansible-lint && ansible-lint infra/ansible
      # - run: docker compose config --quiet
      - run: echo "TODO infra - ansible-lint du playbook et validation de la composition"

  # Quality gate : ce job tourne sur TOUTE modification et bloque à la première
  # vulnérabilité critique. C'est le critère DevSecOps de l'épreuve EC03.
  security:
    runs-on: ubuntu-latest
    steps:
      # Historique complet, sans quoi gitleaks ne verrait que le dernier commit.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      # Trivy couvre les trois angles en un passage : vulnérabilités des
      # dépendances, secrets versionnés, et mauvaises configurations (Terraform,
      # Dockerfile, Compose). exit-code 1 rend le job bloquant. Il ne voit que
      # l'arbre de travail : gitleaks, ci-dessous, couvre l'historique.
      - name: Scan de sécurité (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      # -m compare aussi chaque fusion à ses parents (git log ne montre pas
      # leur contenu par défaut), sans quoi un secret introduit en résolvant
      # un conflit passerait au travers.
      #
      # C'est le binaire qui est utilisé, sous licence MIT. Seule l'action
      # gitleaks v2 exige une licence payante pour les organisations, ce qui
      # avait conduit à l'écarter ; la distinction manquait ici.
      #
      # Job sans secret : enjeu moindre qu'avec sops, mais la somme est
      # aussi simple à vérifier ici que là.
      - name: Scan de l'historique (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xz -C /usr/local/bin -f gitleaks.tar.gz gitleaks
          gitleaks git . --log-opts="--all -m --full-history" --redact --exit-code 1

  # Le risque n'est pas le chiffrement mais l'oubli : un .sops.yaml pas à jour
  # après rechiffrement perd un destinataire, invisible avant le déploiement.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Lu sans déchiffrer : SOPS ne chiffre que les valeurs, pas les clés.
      - name: Les destinataires du fichier sont ceux déclarés
        run: |
          grep -oE 'age1[0-9a-z]{58}' .sops.yaml       | sort -u > attendus.txt
          grep -oE 'age1[0-9a-z]{58}' secrets.enc.yaml | sort -u > effectifs.txt
          diff attendus.txt effectifs.txt

      # Somme publiée par le projet sops pour cette release exacte : le
      # téléchargement épinglait la version, pas le contenu.
      - name: Installer sops
        run: |
          curl -sSfL https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64 -o /usr/local/bin/sops
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /usr/local/bin/sops" | sha256sum -c -
          chmod +x /usr/local/bin/sops

      # Sortie jetée : on vérifie que ça déchiffre, jamais ce que ça contient.
      - name: Le fichier est déchiffrable par la CI
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops decrypt secrets.enc.yaml > /dev/null
