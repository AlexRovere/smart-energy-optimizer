name: CI

# Un sas par domaine : lint, tests, puis construction et scan de l'image.
# L'image est construite pour vérifier que le Dockerfile tient, jamais publiée.
# Un filtrage par chemin évite de rejouer les domaines non modifiés, ce qui est
# l'intérêt d'un monorepo bien câblé.
#
# Le scan du code vit dans security.yml, qui tourne sur tout push pour ne pas
# attendre l'ouverture d'une pull request. Seul le scan des images est ici,
# parce qu'il lui faut les images. docs/ci-cd.md décrit le pipeline entier,
# ses écarts assumés et comment le rejouer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Le jeton est restreint explicitement, donc tout ce qui n'est pas listé ici est
# refusé. paths-filter interroge l'API des fichiers modifiés quand l'événement
# est une pull request, d'où pull-requests: read. Sans cette ligne le job
# changes échoue en « Resource not accessible by integration », et comme il
# conditionne tous les autres, c'est tout le pipeline qui ne tourne pas.
permissions:
  contents: read
  pull-requests: read

jobs:
  # Détermine quels domaines ont changé : les jobs suivants s'y conditionnent.
  changes:
    runs-on: ubuntu-latest
    outputs:
      etl: ${{ steps.filter.outputs.etl }}
      ml: ${{ steps.filter.outputs.ml }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Chaque domaine écoute aussi ce fichier : une modification du
          # pipeline rejoue tout, sans quoi une PR qui ne touche que la CI ne
          # déclenche aucun job et ne prouve donc rien.
          filters: |
            etl:
              - 'apps/etl/**'
              - '.github/workflows/ci.yml'
            ml:
              - 'apps/ml/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '.github/workflows/ci.yml'

  etl:
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, cache-dependency-glob: apps/etl/uv.lock }

      # Bloquant, comme le service ML. #140 est fusionnée et son code est passé
      # dans cette même PR par `ruff check --fix`, `ruff format`, puis dix-neuf
      # corrections à la main. Les 103 tests de l'ETL passent après.
      #
      # Voir le job ml pour le motif de l'épinglage de version.
      - name: Lint (ruff)
        run: uvx ruff@0.16.8 check apps/etl --output-format github

      - name: Formatage (ruff)
        run: uvx ruff@0.16.8 format --check apps/etl

      - name: Rapport qualité
        if: always()
        run: |
          mkdir -p rapport-qualite
          uvx ruff@0.16.8 check apps/etl --output-format json --output-file rapport-qualite/etl-lint.json || true
          {
            echo "### ETL, lint Python"
            echo '```'
            uvx ruff@0.16.8 check apps/etl --statistics || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rapport-qualite-etl
          path: rapport-qualite/

      # TODO : les tests arrivent avec #51.
      # - run: uv run --directory apps/etl pytest
      - run: echo "TODO ETL - tests unitaires, dont la gestion des null et de data_quality"

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, cache-dependency-glob: apps/ml/uv.lock }

      # Bloquant ici, contrairement à l'ETL : rien n'est en vol sur ce
      # répertoire et son code est passé au vert dans cette même PR.
      #
      # ruff est épinglé en 0.16.8. Le jeu de règles par défaut change d'une
      # version à l'autre : une CI qui rougit parce qu'un outil s'est mis à
      # jour tout seul n'apprend rien à personne et se fait désactiver.
      #
      # --output-format github annote directement les lignes fautives dans
      # l'onglet « Files changed » de la pull request, au lieu d'obliger à
      # ouvrir le log pour savoir où regarder.
      - name: Lint (ruff)
        run: uvx ruff@0.16.8 check apps/ml --output-format github

      - name: Formatage (ruff)
        run: uvx ruff@0.16.8 format --check apps/ml

      # if: always() pour que le rapport existe surtout quand le lint a échoué,
      # qui est le moment où on a besoin de le lire.
      - name: Rapport qualité
        if: always()
        run: |
          mkdir -p rapport-qualite
          uvx ruff@0.16.8 check apps/ml --output-format json --output-file rapport-qualite/ml-lint.json || true
          {
            echo "### Service ML, lint Python"
            echo '```'
            uvx ruff@0.16.8 check apps/ml --statistics || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rapport-qualite-ml
          path: rapport-qualite/

      # TODO : les tests arrivent avec #51.
      # - run: uv run --directory apps/ml pytest
      - run: echo "TODO ML - tests du contrat de l API de prediction"

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm s'installe AVANT setup-node : c'est setup-node qui calcule la clé
      # du cache pnpm, et il lui faut le gestionnaire déjà présent. La version
      # est épinglée parce que la 9 ne lit pas ce lockfile, et que la dernière
      # refuse un pnpm-workspace.yaml sans champ packages.
      - uses: pnpm/action-setup@v4
        with: { version: 10.11.0 }
      # Node 22 et non 20 : Vitest 5 demande 20.19 au minimum, et `node-version: 20`
      # résout à la dernière 20.x du moment, ce qui est un pari inutile.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm --dir apps/dashboard install --frozen-lockfile
      - run: pnpm --dir apps/dashboard lint

      - name: Rapport qualité
        if: always()
        run: |
          mkdir -p rapport-qualite
          pnpm --dir apps/dashboard exec eslint . -f json -o "$GITHUB_WORKSPACE/rapport-qualite/dashboard-lint.json" || true
          {
            echo "### Dashboard, lint TypeScript et Vue"
            echo '```'
            pnpm --dir apps/dashboard exec eslint . -f stylish || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: rapport-qualite-dashboard
          path: rapport-qualite/

      # nuxt.config.ts pose typeCheck: false, donc ni `nuxt build` ni `eslint`
      # ne regardent les types : sans cette étape, vue-tsc ne tournerait nulle
      # part et la CI couvrirait moins qu'elle n'en a l'air.
      - run: pnpm --dir apps/dashboard typecheck
      # Les tests de base démarrent eux-mêmes un conteneur postgres:16-alpine
      # par Testcontainers : le démon Docker d'ubuntu-latest suffit, il n'y a
      # aucun service à déclarer ici.
      - run: pnpm --dir apps/dashboard test
      - run: pnpm --dir apps/dashboard build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Terraform est passé hors périmètre au J1 : plus de ressource de
      # fournisseur à créer, la machine est fournie. Ansible décrit désormais
      # la configuration reproductible de cette machine.
      - name: Le playbook Ansible est valide
        run: pipx install ansible-lint && ansible-lint infra/ansible
      # Les valeurs sont bidon et c'est voulu : `:?` refuse une variable vide
      # autant qu'absente, et la validation porte sur la structure du fichier,
      # jamais sur ce que les variables contiennent.
      - name: La composition est valide
        env:
          POSTGRES_PASSWORD: ci
          ETL_DB_PASSWORD: ci
          ETL_DB_USER : ci
          SEED_PASSWORD: ci
          SESSION_SECRET: ci
          MOCK_API_URL: http://ci
          PARQUET_DIR_HOST: ./data/parquet
        run: docker compose config --quiet
      # Aucune variable, et c'est le contrôle : la composition de développement
      # doit se lire sur un poste qui n'a rien configuré.
      - name: La composition de développement est valide sans aucune variable
        run: docker compose -f docker-compose.dev.yml config --quiet

  # Les trois jobs qui suivent construisent les images sans les publier. Le
  # quota de paquets privés de l'offre gratuite est de 500 Mo et l'image du
  # service ML le dépasse à elle seule ; les publier en public exposerait le
  # code. Le déploiement reconstruit sur la machine (#107). Construire ici ne
  # sert donc qu'à une chose, mais elle compte : savoir que le Dockerfile tient
  # avant de fusionner, et non le soir du déploiement.
  #
  # Chacun attend son domaine : construire une image dont le lint ou les tests
  # échouent achète des minutes de runner contre rien.
  #
  # Deux passages de Trivy sur l'image qui vient d'être construite, jamais
  # reconstruite : elle est déjà dans le démon local. Le premier affiche ce
  # qu'il trouve sans bloquer, le second échoue sur une vulnérabilité critique.
  #
  # Le seuil bloquant est CRITICAL ici, alors que security.yml bloque dès HIGH.
  # Ce n'est pas une incohérence : security.yml scanne NOS dépendances, qu'on
  # choisit et qu'on peut monter le jour même. Une image scanne en plus les
  # paquets système de la base Debian, dont le rythme de correction ne nous
  # appartient pas. Bloquer dessus rendrait la CI rouge pendant des jours sans
  # que personne ne puisse rien y faire, et une CI rouge en permanence apprend
  # à l'équipe à ignorer le rouge. Les HIGH restent affichés, pour qu'aucun ne
  # se découvre le jour où il devient critique.
  image-etl:
    needs: [changes, etl]
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag enervision-etl:ci apps/etl
      - name: Vulnérabilités de l'image (signalement)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: enervision-etl:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # skip-setup-trivy : le binaire et la base sont déjà là depuis l'étape
      # précédente, les retélécharger coûterait une minute pour rien.
      - name: Aucune vulnérabilité critique
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: enervision-etl:ci
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

  image-ml:
    needs: [changes, ml]
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag enervision-ml:ci apps/ml
      - name: Vulnérabilités de l'image (signalement)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: enervision-ml:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # skip-setup-trivy : le binaire et la base sont déjà là depuis l'étape
      # précédente, les retélécharger coûterait une minute pour rien.
      - name: Aucune vulnérabilité critique
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: enervision-ml:ci
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

  image-dashboard:
    needs: [changes, dashboard]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag enervision-dashboard:ci apps/dashboard
      - name: Vulnérabilités de l'image (signalement)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: enervision-dashboard:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # skip-setup-trivy : le binaire et la base sont déjà là depuis l'étape
      # précédente, les retélécharger coûterait une minute pour rien.
      - name: Aucune vulnérabilité critique
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: enervision-dashboard:ci
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true
