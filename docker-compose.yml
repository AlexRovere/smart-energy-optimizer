# Pile on-premise. Les services applicatifs sont commentés tant que leur
# Dockerfile n'existe pas : `docker compose up -d` doit fonctionner dès le J1.
services:
  # PostgreSQL nu, sans TimescaleDB : la base ne porte plus les mesures, qui
  # vivent en fichiers Parquet sur le volume partagé. Il ne lui reste que le
  # référentiel des sites, les comptes, les rôles et les périmètres d'accès.
  postgres:
    image: postgres:16-alpine
    container_name: enervision-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enervision}
      POSTGRES_USER: ${POSTGRES_USER:-enervision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseigner POSTGRES_PASSWORD dans .env}
    # Lié à la boucle locale : pratique pour un client SQL sur son poste,
    # injoignable depuis le réseau. Aucun service interne n'est exposé.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enervision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: enervision-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: enervision-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?renseigner GRAFANA_PASSWORD dans .env}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # À décommenter service par service, dès que son Dockerfile existe. Le
  # reverse proxy et le service ML manquent encore : ils viendront avec leurs
  # tickets. Les montages ci-dessous sont la partie à ne pas improviser.
  #
  # etl:
  #   build: ./apps/etl
  #   environment:
  #     MOCK_API_URL: ${MOCK_API_URL:?}
  #     PARQUET_DIR_EXPOSE: /data/expose
  #     PARQUET_DIR_ENTRAINEMENT: /data/entrainement
  #     # Accès borné au référentiel des sites (docs/architecture.md, Points tranchés).
  #     POSTGRES_HOST: postgres
  #     POSTGRES_PORT: 5432
  #     POSTGRES_DB: ${POSTGRES_DB:-enervision}
  #     # Le rôle etl, et surtout pas le propriétaire de la base : SELECT et
  #     # INSERT sur la seule table sites, UPDATE sur sept de ses colonnes. Il
  #     # ne peut lire ni les comptes, ni les sessions, ni les périmètres, et
  #     # ne peut pas écrire warning_threshold_kw (docs/data.md).
  #     POSTGRES_USER: etl
  #     POSTGRES_PASSWORD: ${ETL_DB_PASSWORD:?renseigner ETL_DB_PASSWORD dans .env}
  #   volumes:
  #     - parquet_data:/data          # seul montage en écriture de tout le système
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #   restart: unless-stopped
  #
  # dashboard:
  #   build: ./apps/dashboard
  #   environment:
  #     NUXT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  #     PARQUET_DIR_EXPOSE: /data/expose
  #     ML_API_URL: ${ML_API_URL:-http://ml:8000}
  #   volumes:
  #     - parquet_data:/data:ro       # lecture seule, et rien d'autre que l'exposé
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #   restart: unless-stopped

volumes:
  db_data:
  prom_data:
  grafana_data:
  # Le volume de données n'appartient à aucun service : l'ETL est le seul à le
  # monter en écriture, l'applicatif et le ML n'en montent qu'un répertoire
  # chacun, en lecture seule. C'est ce montage qui applique le cloisonnement,
  # et il est donc vérifiable ici plutôt que dans du code.
  parquet_data:
