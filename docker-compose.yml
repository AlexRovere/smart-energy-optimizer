# Pile on-premise.
services:
  # PostgreSQL nu, sans TimescaleDB : la base ne porte plus les mesures, qui
  # vivent en fichiers Parquet sur le volume partagé. Il ne lui reste que le
  # référentiel des sites, les comptes, les rôles et les périmètres d'accès.
  postgres:
    image: postgres:16-alpine
    container_name: enervision-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enervision}
      POSTGRES_USER: ${POSTGRES_USER:-enervision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseigner POSTGRES_PASSWORD dans .env}
    # Lié à la boucle locale : pratique pour un client SQL sur son poste,
    # injoignable depuis le réseau. Aucun service interne n'est exposé.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enervision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  etl:
    build: ./apps/etl
    environment:
      MOCK_API_URL: ${MOCK_API_URL:?renseigner MOCK_API_URL dans .env}
      PARQUET_DIR_EXPOSE: /data/expose
      PARQUET_DIR_ENTRAINEMENT: /data/entrainement
    volumes:
      - parquet_data:/data
    restart: unless-stopped

  ml:
    build: ./apps/ml
    environment:
      PARQUET_DIR_ENTRAINEMENT: /data/entrainement
    volumes:
      - parquet_data:/data:ro
    restart: unless-stopped

  dashboard:
    build: ./apps/dashboard
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-enervision}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-enervision}
      PARQUET_DIR_EXPOSE: /data/expose
      ML_API_URL: ${ML_API_URL:-http://ml:8000}
      NUXT_SESSION_SECRET: ${NUXT_SESSION_SECRET:?renseigner NUXT_SESSION_SECRET dans .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - parquet_data:/data:ro       # lecture seule, et rien d'autre que l'exposé
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  # Le volume de données n'appartient à aucun service : l'ETL est le seul à le
  # monter en écriture, l'applicatif et le ML n'en montent qu'un répertoire
  # chacun, en lecture seule. C'est ce montage qui applique le cloisonnement,
  # et il est donc vérifiable ici plutôt que dans du code.
  parquet_data:
