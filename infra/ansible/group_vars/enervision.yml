---
# Tout ce que le playbook consomme et qui décrit la machine ou ce qu'on y
# déploie. Ce qui varie d'une machine à l'autre vit dans host_vars/.
application_user: apprenant
application_group: apprenant
project_parent: /home/apprenant/Projet
project_dir: "{{ project_parent }}/enerVision"
parquet_dir: /data/output
log_dir: /var/log/enervision
# Hors de log_dir, que node-exporter ne peut pas lire.
metrics_dir: /var/lib/enervision/metrics
age_key_file: /home/apprenant/.config/sops/age/keys.txt

repository_url: https://github.com/EADL-2026/enerVision.git
repository_version: main

# Le dépôt est privé et la machine ne porte aucun identifiant git : le jeton
# arrive par l'environnement, le workflow passant celui du job et un
# déploiement manuel le sien. Il n'est écrit nulle part sur la machine, ni
# dans .git/config ni dans la configuration de l'utilisateur.
repository_token: "{{ lookup('env', 'GH_REPOSITORY_TOKEN') | trim }}"
repository_credential_env:
  GIT_TERMINAL_PROMPT: "0"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "http.https://github.com/.extraheader"
  GIT_CONFIG_VALUE_0: "AUTHORIZATION: basic {{ ('x-access-token:' ~ repository_token) | b64encode }}"

# Se désactive au besoin sans toucher au dépôt : `-e run_database_seed=false`
# l'emporte sur cette valeur.
run_database_seed: true
