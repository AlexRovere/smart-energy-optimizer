name: CI

# Un sas par domaine : lint, tests, puis construction et scan de l'image.
# L'image est construite pour vérifier que le Dockerfile tient, jamais publiée.
# Un filtrage par chemin évite de rejouer les domaines non modifiés, ce qui est
# l'intérêt d'un monorepo bien câblé.
#
# Le scan du code vit dans security.yml, qui tourne sur tout push pour ne pas
# attendre l'ouverture d'une pull request. Seul le scan des images est ici,
# parce qu'il lui faut les images. docs/ci-cd.md décrit le pipeline entier,
# ses écarts assumés et comment le rejouer.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Le jeton est restreint explicitement, donc tout ce qui n'est pas listé ici est
# refusé. paths-filter interroge l'API des fichiers modifiés quand l'événement
# est une pull request, d'où pull-requests: read. Sans cette ligne le job
# changes échoue en « Resource not accessible by integration », et comme il
# conditionne tous les autres, c'est tout le pipeline qui ne tourne pas.
permissions: {}

# Chemin CONTENEUR attendu par l'app (docker-compose.yml, ml.environment.PARQUET_DIR) : une
# seule définition, reprise dans load-test-ml et load-test-dashboard plutôt que redupliquée.
# Sans lien avec PARQUET_DIR_HOST (/data/output), qui est le chemin HÔTE sur la VM (infra/ansible).
env:
  PARQUET_DIR: /data

jobs:
  # Détermine quels domaines ont changé : les jobs suivants s'y conditionnent.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      etl: ${{ steps.filter.outputs.etl }}
      ml: ${{ steps.filter.outputs.ml }}
      mockapi: ${{ steps.filter.outputs.mockapi }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      infra: ${{ steps.filter.outputs.infra }}
      loadtest: ${{ steps.filter.outputs.loadtest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Chaque domaine écoute aussi ce fichier : une modification du
          # pipeline rejoue tout, sans quoi une PR qui ne touche que la CI ne
          # déclenche aucun job et ne prouve donc rien.
          filters: |
            etl:
              - 'apps/etl/**'
              - '.github/workflows/ci.yml'
            ml:
              - 'apps/ml/**'
              - '.github/workflows/ci.yml'
            mockapi:
              - 'apps/mock-api/**'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'apps/dashboard/**'
              - '.github/workflows/ci.yml'
            infra:
              - 'infra/**'
              - 'docker-compose.yml'
              - 'docker-compose.dev.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/deploy.yml'
            loadtest:
              - 'load-tests/**'
              - '.github/workflows/ci.yml'

  etl:
    needs: changes
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with: { enable-cache: true, cache-dependency-glob: apps/etl/uv.lock }

      # Bloquant, comme le service ML. #140 est fusionnée et son code est passé
      # dans cette même PR par `ruff check --fix`, `ruff format`, puis dix-neuf
      # corrections à la main. Les 103 tests de l'ETL passent après.
      #
      # Voir le job ml pour le motif de l'épinglage de version.
      - name: Lint (ruff)
        run: uvx --no-build ruff@0.16.8 check apps/etl --output-format github

      - name: Formatage (ruff)
        run: uvx --no-build ruff@0.16.8 format --check apps/etl

      - name: Rapport qualité
        if: always()
        run: |
          mkdir -p rapport-qualite
          uvx --no-build ruff@0.16.8 check apps/etl --output-format json --output-file rapport-qualite/etl-lint.json || true
          {
            echo "### ETL, lint Python"
            echo '```'
            uvx --no-build ruff@0.16.8 check apps/etl --statistics || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: rapport-qualite-etl
          path: rapport-qualite/

      # #51 : tests unitaires, dont la gestion des null et de data_quality, et le
      # garde-fou de performance de transform_readings() (test/transform/test_readings_perf.py).
      - name: Tests (pytest)
        run: uv run --directory apps/etl --frozen --no-build pytest

  ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with: { enable-cache: true, cache-dependency-glob: apps/ml/uv.lock }

      # Bloquant ici, contrairement à l'ETL : rien n'est en vol sur ce
      # répertoire et son code est passé au vert dans cette même PR.
      #
      # ruff est épinglé en 0.16.8. Le jeu de règles par défaut change d'une
      # version à l'autre : une CI qui rougit parce qu'un outil s'est mis à
      # jour tout seul n'apprend rien à personne et se fait désactiver.
      #
      # --output-format github annote directement les lignes fautives dans
      # l'onglet « Files changed » de la pull request, au lieu d'obliger à
      # ouvrir le log pour savoir où regarder.
      - name: Lint (ruff)
        run: uvx --no-build ruff@0.16.8 check apps/ml --output-format github

      - name: Formatage (ruff)
        run: uvx --no-build ruff@0.16.8 format --check apps/ml

      # if: always() pour que le rapport existe surtout quand le lint a échoué,
      # qui est le moment où on a besoin de le lire.
      - name: Rapport qualité
        if: always()
        run: |
          mkdir -p rapport-qualite
          uvx --no-build ruff@0.16.8 check apps/ml --output-format json --output-file rapport-qualite/ml-lint.json || true
          {
            echo "### Service ML, lint Python"
            echo '```'
            uvx --no-build ruff@0.16.8 check apps/ml --statistics || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: rapport-qualite-ml
          path: rapport-qualite/

      # Le seuil de couverture (80 % sur src) est porté par pyproject.toml : pas
      # de --cov-fail-under ici, une seule source de vérité.
      - name: Tests (pytest)
        run: uv run --directory apps/ml --frozen --no-build pytest

  mock-api:
    needs: changes
    if: needs.changes.outputs.mockapi == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with: { enable-cache: true, cache-dependency-glob: apps/mock-api/uv.lock }

      # Bloquant, comme pour le ML : brique neuve, passée au vert dès sa création.
      - name: Lint (ruff)
        run: uvx --no-build ruff@0.16.8 check apps/mock-api --output-format github

      - name: Formatage (ruff)
        run: uvx --no-build ruff@0.16.8 format --check apps/mock-api

      # if: always() pour que le rapport existe surtout quand le lint a échoué,
      # qui est le moment où on a besoin de le lire.
      - name: Rapport qualité
        if: always()
        run: |
          mkdir -p rapport-qualite
          uvx --no-build ruff@0.16.8 check apps/mock-api --output-format json --output-file rapport-qualite/mock-api-lint.json || true
          {
            echo "### Simulateur API Mock, lint Python"
            echo '```'
            uvx --no-build ruff@0.16.8 check apps/mock-api --statistics || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: rapport-qualite-mock-api
          path: rapport-qualite/

      # Le seuil de couverture (90 % sur src) est porté par pyproject.toml : pas
      # de --cov-fail-under ici, une seule source de vérité.
      - name: Tests (pytest)
        run: uv run --directory apps/mock-api --frozen --no-build pytest

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # pnpm s'installe AVANT setup-node : c'est setup-node qui calcule la clé
      # du cache pnpm, et il lui faut le gestionnaire déjà présent. La version
      # est épinglée parce que la 9 ne lit pas ce lockfile, et que la dernière
      # refuse un pnpm-workspace.yaml sans champ packages.
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.11.0 }
      # Node 22 et non 20 : Vitest 5 demande 20.19 au minimum, et `node-version: 20`
      # résout à la dernière 20.x du moment, ce qui est un pari inutile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml
      - run: pnpm --dir apps/dashboard install --frozen-lockfile
      - run: pnpm --dir apps/dashboard lint

      - name: Rapport qualité
        if: always()
        run: |
          mkdir -p rapport-qualite
          pnpm --dir apps/dashboard exec eslint . -f json -o "$GITHUB_WORKSPACE/rapport-qualite/dashboard-lint.json" || true
          {
            echo "### Dashboard, lint TypeScript et Vue"
            echo '```'
            pnpm --dir apps/dashboard exec eslint . -f stylish || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: rapport-qualite-dashboard
          path: rapport-qualite/

      # nuxt.config.ts pose typeCheck: false, donc ni `nuxt build` ni `eslint`
      # ne regardent les types : sans cette étape, vue-tsc ne tournerait nulle
      # part et la CI couvrirait moins qu'elle n'en a l'air.
      - run: pnpm --dir apps/dashboard typecheck
      # Les tests de base démarrent eux-mêmes un conteneur postgres:16-alpine
      # par Testcontainers : le démon Docker d'ubuntu-latest suffit, il n'y a
      # aucun service à déclarer ici.
      - run: pnpm --dir apps/dashboard test
      - run: pnpm --dir apps/dashboard build

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      # Terraform est passé hors périmètre au J1 : plus de ressource de
      # fournisseur à créer, la machine est fournie. Ansible décrit désormais
      # la configuration reproductible de cette machine.
      - name: Le playbook Ansible est valide
        run: pipx install ansible-lint && ansible-lint infra/ansible
      # Les valeurs sont bidon et c'est voulu : `:?` refuse une variable vide
      # autant qu'absente, et la validation porte sur la structure du fichier,
      # jamais sur ce que les variables contiennent. Seuls les secrets figurent
      # ici : si un réglage devait être ajouté pour que l'étape passe, c'est
      # qu'il a perdu son défaut dans la composition (#197).
      - name: La composition est valide avec les seuls secrets
        env:
          POSTGRES_PASSWORD: ci
          ETL_DB_PASSWORD: ci
          SEED_PASSWORD: ci
          SESSION_SECRET: ci
          MOCK_API_URL: http://ci
          GRAFANA_ADMIN_PASSWORD: ci
        run: docker compose config --quiet
      # Aucune variable, et c'est le contrôle : la composition de développement
      # doit se lire sur un poste qui n'a rien configuré.
      - name: La composition de développement est valide sans aucune variable
        run: docker compose -f docker-compose.dev.yml config --quiet

  # Les trois jobs qui suivent construisent les images sans les publier. Le
  # quota de paquets privés de l'offre gratuite est de 500 Mo et l'image du
  # service ML le dépasse à elle seule ; les publier en public exposerait le
  # code. Le déploiement reconstruit sur la machine (#107). Construire ici ne
  # sert donc qu'à une chose, mais elle compte : savoir que le Dockerfile tient
  # avant de fusionner, et non le soir du déploiement.
  #
  # Chacun attend son domaine : construire une image dont le lint ou les tests
  # échouent achète des minutes de runner contre rien.
  #
  # Deux passages de Trivy sur l'image qui vient d'être construite, jamais
  # reconstruite : elle est déjà dans le démon local. Le premier affiche ce
  # qu'il trouve sans bloquer, le second échoue sur une vulnérabilité critique.
  #
  # Le seuil bloquant est CRITICAL ici, alors que security.yml bloque dès HIGH.
  # Ce n'est pas une incohérence : security.yml scanne NOS dépendances, qu'on
  # choisit et qu'on peut monter le jour même. Une image scanne en plus les
  # paquets système de la base Debian, dont le rythme de correction ne nous
  # appartient pas. Bloquer dessus rendrait la CI rouge pendant des jours sans
  # que personne ne puisse rien y faire, et une CI rouge en permanence apprend
  # à l'équipe à ignorer le rouge. Les HIGH restent affichés, pour qu'aucun ne
  # se découvre le jour où il devient critique.
  image-etl:
    needs: [changes, etl]
    if: needs.changes.outputs.etl == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: docker build --tag enervision-etl:ci apps/etl
      - name: Vulnérabilités de l'image (signalement)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: enervision-etl:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # skip-setup-trivy : le binaire et la base sont déjà là depuis l'étape
      # précédente, les retélécharger coûterait une minute pour rien.
      - name: Aucune vulnérabilité critique
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: enervision-etl:ci
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

  image-ml:
    needs: [changes, ml]
    if: needs.changes.outputs.ml == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: docker build --tag enervision-ml:ci apps/ml
      - name: Vulnérabilités de l'image (signalement)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: enervision-ml:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # skip-setup-trivy : le binaire et la base sont déjà là depuis l'étape
      # précédente, les retélécharger coûterait une minute pour rien.
      - name: Aucune vulnérabilité critique
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: enervision-ml:ci
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

  image-mock-api:
    needs: [changes, mock-api]
    if: needs.changes.outputs.mockapi == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: docker build --tag enervision-mock-api:ci apps/mock-api
      - name: Vulnérabilités de l'image (signalement)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: enervision-mock-api:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # skip-setup-trivy : le binaire et la base sont déjà là depuis l'étape
      # précédente, les retélécharger coûterait une minute pour rien.
      - name: Aucune vulnérabilité critique
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: enervision-mock-api:ci
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

  image-dashboard:
    needs: [changes, dashboard]
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - run: docker build --tag enervision-dashboard:ci apps/dashboard
      - name: Vulnérabilités de l'image (signalement)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: enervision-dashboard:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      # skip-setup-trivy : le binaire et la base sont déjà là depuis l'étape
      # précédente, les retélécharger coûterait une minute pour rien.
      - name: Aucune vulnérabilité critique
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: image
          image-ref: enervision-dashboard:ci
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          skip-setup-trivy: true

  # #51 : mesure de charge et de performance du service ML, via Locust (load-tests/).
  # Bloquant : /predictions et /training n'appellent aucun tiers, rien n'échappe à notre
  # contrôle si un seuil est dépassé.
  #
  # L'image est reconstruite ici plutôt que réutilisée depuis image-ml : chaque job démarre
  # sur un runner neuf, sans démon Docker partagé entre jobs, et publier l'image dépasserait
  # le quota de paquets privés de l'offre gratuite (voir le commentaire au-dessus d'image-etl).
  load-test-ml:
    needs: changes
    if: needs.changes.outputs.ml == 'true' || needs.changes.outputs.loadtest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with: { enable-cache: true, cache-dependency-glob: load-tests/uv.lock }

      - run: docker build --tag enervision-ml:ci apps/ml

      # Historique synthétique, jamais l'API Mock réelle : voir load-tests/fixtures/synthetic_history.py.
      - name: Historique synthétique
        run: >
          uv run --directory load-tests --frozen --no-build python -m fixtures.synthetic_history

      - name: Démarrage du service ML
        run: |
          docker run -d --rm --name ml-under-test \
            -p 8000:8000 \
            -e PARQUET_DIR="$PARQUET_DIR" \
            -v "$GITHUB_WORKSPACE/data/loadtest-parquet:$PARQUET_DIR:ro" \
            enervision-ml:ci
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health >/dev/null; do sleep 1; done'

      # Produit l'alias "champion" qu'attend get_prediction_model() ; sans ce passage,
      # /predictions répondrait systématiquement 503.
      - name: Entraînement initial (alias champion)
        run: curl -sf -X POST http://localhost:8000/training

      - name: Charge (predictions par horizon, training)
        run: |
          mkdir -p rapport-qualite
          uv run --directory load-tests --frozen --no-build locust \
            -f locustfiles/ml_predictions.py -f locustfiles/ml_training.py \
            --headless -u 10 -r 2 -t 30s \
            --host http://localhost:8000 \
            --csv="$GITHUB_WORKSPACE/rapport-qualite/loadtest-ml"

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Service ML, charge et performance"
            echo '```'
            cat rapport-qualite/loadtest-ml_stats.csv 2>/dev/null || echo "Rapport indisponible"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: rapport-qualite-loadtest-ml
          path: rapport-qualite/

      # Seuils de performance (load-tests/thresholds.py) : en dernier, pour que le rapport et
      # l'artefact existent même quand cette étape fait échouer le job.
      - name: Seuils de performance
        run: >
          uv run --directory load-tests --frozen --no-build python check_thresholds.py ml

      - name: Arrêt du service
        if: always()
        run: docker stop ml-under-test || true

  # #51 : mesure de charge du dashboard. L'historique interne (Parquet direct, history.get.ts)
  # est bloquant. L'accès à l'API Mock (current.get.ts) ne l'est JAMAIS : cette route dépend
  # d'un tiers externe hors CI, tapé ici contre le simulateur (apps/mock-api) et jamais contre la
  # source réelle (quota partagé de 500 pts/h, docs/api.md). Voir docs/ci-cd.md pour le motif.
  load-test-dashboard:
    needs: changes
    if: >-
      needs.changes.outputs.dashboard == 'true' ||
      needs.changes.outputs.loadtest == 'true' ||
      needs.changes.outputs.mockapi == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: enervision
          POSTGRES_USER: enervision
          POSTGRES_PASSWORD: mot-de-passe-de-charge-local
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U enervision"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: enervision
      POSTGRES_USER: enervision
      POSTGRES_PASSWORD: mot-de-passe-de-charge-local
      SEED_PASSWORD: mot-de-passe-de-demonstration-charge
      ETL_DB_PASSWORD: inutilise-par-ce-job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            load-tests/uv.lock
            apps/mock-api/uv.lock
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with: { version: 10.11.0 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/dashboard/pnpm-lock.yaml

      - run: docker build --tag enervision-ml:ci apps/ml
      - run: docker build --tag enervision-dashboard:ci apps/dashboard

      - name: Historique synthétique
        run: >
          uv run --directory load-tests --frozen --no-build python -m fixtures.synthetic_history

      # Le simulateur rejoue la forme, la latence et le plafond de l'API Mock
      # réelle, jamais la source elle-même. Latence et quota y sont coupés par
      # défaut : c'est ce job qui les pose.
      - name: Démarrage du simulateur API Mock
        env:
          MOCK_LATENCY_MS: "150"
          MOCK_RATE_LIMIT_PER_HOUR: "500"
        run: |
          nohup uv run --directory apps/mock-api --frozen --no-build uvicorn mock_api.app:app \
            --host 0.0.0.0 --port 9999 > mock-api.log 2>&1 &
          timeout 30 bash -c 'until curl -sf http://localhost:9999/api/v1/sites/SITE001/current >/dev/null; do sleep 1; done'

      # Nécessaire à /api/sites/{id}/recommendations, qui appelle le service ML réel.
      - name: Démarrage du service ML
        run: |
          docker run -d --rm --name ml-under-test \
            -p 8000:8000 \
            -e PARQUET_DIR="$PARQUET_DIR" \
            -v "$GITHUB_WORKSPACE/data/loadtest-parquet:$PARQUET_DIR:ro" \
            enervision-ml:ci
          timeout 60 bash -c 'until curl -sf http://localhost:8000/health >/dev/null; do sleep 1; done'
          curl -sf -X POST http://localhost:8000/training

      - run: pnpm --dir apps/dashboard install --frozen-lockfile
      - name: Migration et amorçage
        run: |
          pnpm --dir apps/dashboard db:migrate
          pnpm --dir apps/dashboard db:seed

      # host.docker.internal, pour que le conteneur dashboard joigne Postgres (service
      # GitHub Actions), le service ML et le simulateur, tous publiés sur l'hôte du runner.
      - name: Démarrage du dashboard
        run: |
          docker run -d --rm --name dashboard-under-test \
            -p 3000:3000 \
            --add-host=host.docker.internal:host-gateway \
            -e NUXT_POSTGRES_HOST=host.docker.internal \
            -e NUXT_POSTGRES_PORT=5432 \
            -e NUXT_POSTGRES_DATABASE=enervision \
            -e NUXT_POSTGRES_USER=enervision \
            -e NUXT_POSTGRES_PASSWORD=mot-de-passe-de-charge-local \
            -e NUXT_PARQUET_DIR="$PARQUET_DIR" \
            -e NUXT_ML_SERVICE_URL=http://host.docker.internal:8000 \
            -e NUXT_MOCK_API_URL=http://host.docker.internal:9999 \
            -e NUXT_SESSION_PASSWORD=secret-de-session-de-charge-au-moins-32-caracteres \
            -e NUXT_TRUST_PROXY=false \
            -v "$GITHUB_WORKSPACE/data/loadtest-parquet:$PARQUET_DIR:ro" \
            enervision-dashboard:ci
          timeout 60 bash -c 'until curl -sf http://localhost:3000/ >/dev/null; do sleep 1; done'

      # Le cookie de session est Secure (nuxt.config.ts, critère de #29) : un client HTTP standard
      # ne le renvoie jamais en clair, donc Locust en HTTP direct se connecte sans jamais rester
      # authentifié après /login. En production ce rôle est tenu par Caddy (443) ; ici un second
      # conteneur Caddy fait la même chose, avec un certificat interne auto-signé.
      - name: TLS devant le dashboard (cookie Secure)
        run: |
          docker run -d --rm --name dashboard-tls \
            -p 3443:3443 \
            --add-host=host.docker.internal:host-gateway \
            caddy:2-alpine caddy reverse-proxy --from localhost:3443 --to host.docker.internal:3000 --internal-certs
          timeout 30 bash -c 'until curl -sfk https://localhost:3443/ >/dev/null; do sleep 1; done'
          docker cp dashboard-tls:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"

      - name: Charge (historique, bloquant)
        env:
          LOAD_TEST_DASHBOARD_PASSWORD: mot-de-passe-de-demonstration-charge
          LOAD_TEST_CA_BUNDLE: ${{ runner.temp }}/caddy-root.crt
        run: |
          mkdir -p rapport-qualite
          uv run --directory load-tests --frozen --no-build locust \
            -f locustfiles/dashboard_history.py \
            --headless -u 5 -r 1 -t 30s \
            --host https://localhost:3443 \
            --csv="$GITHUB_WORKSPACE/rapport-qualite/loadtest-dashboard-history"

      # Jamais bloquant : le tiers (ou son simulateur) n'est pas sous notre contrôle.
      - name: Charge (accès API Mock, informatif)
        if: always()
        env:
          LOAD_TEST_DASHBOARD_PASSWORD: mot-de-passe-de-demonstration-charge
          LOAD_TEST_CA_BUNDLE: ${{ runner.temp }}/caddy-root.crt
        run: |
          mkdir -p rapport-qualite
          uv run --directory load-tests --frozen --no-build locust \
            -f locustfiles/dashboard_mock.py \
            --headless -u 5 -r 1 -t 30s \
            --host https://localhost:3443 \
            --csv="$GITHUB_WORKSPACE/rapport-qualite/loadtest-dashboard-mock" || true

      - name: Résumé
        if: always()
        run: |
          {
            echo "### Dashboard, charge (historique bloquant, API Mock informatif)"
            echo '```'
            cat rapport-qualite/loadtest-dashboard-history_stats.csv 2>/dev/null || echo "Rapport historique indisponible"
            cat rapport-qualite/loadtest-dashboard-mock_stats.csv 2>/dev/null || echo "Rapport API Mock indisponible"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: rapport-qualite-loadtest-dashboard
          path: rapport-qualite/

      - name: Seuils de performance (historique uniquement)
        run: >
          uv run --directory load-tests --frozen --no-build python check_thresholds.py dashboard-history

      - name: Arrêt des services
        if: always()
        run: |
          docker stop dashboard-tls || true
          docker stop dashboard-under-test || true
          docker stop ml-under-test || true
