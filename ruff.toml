# Configuration unique pour tout le Python du dépôt : `apps/etl` et `apps/ml`.
#
# Un seul fichier plutôt qu'un par application. Deux jeux de règles séparés
# finissent toujours par diverger, et jamais pour une bonne raison : on désactive
# une règle gênante d'un côté sans que personne ne le voie de l'autre.
#
# La version de ruff est épinglée dans le pipeline, pas ici. Le jeu de règles par
# défaut change d'une version à l'autre : une CI qui rougit parce qu'un outil
# s'est mis à jour tout seul n'apprend rien à personne.

# 100 et non 88, la valeur par défaut. À 88 il reste 21 lignes à réécrire dans du
# code déjà livré, ce qui transforme une mise en place d'outil en réécriture. À
# 120 il n'en reste aucune et la règle ne mesure plus rien. À 100 il en reste 5,
# et chacune est réellement trop longue.
line-length = 100

# Les deux applications déclarent requires-python >=3.12,<3.13.
target-version = "py312"

# Le notebook d'exploration est exclu du lint. Un notebook n'est pas du code de
# production : il contient des cellules dans le désordre, des variables d'essai
# et des imports laissés en place exprès, qui sont la trace du raisonnement. Le
# code qui en sort est repris dans `apps/ml/src`, lui bien linté.
exclude = ["apps/ml/notebooks"]

[lint]
select = [
  "E",   # pycodestyle, erreurs
  "W",   # pycodestyle, avertissements
  "F",   # pyflakes : imports inutilisés, noms non définis
  "I",   # isort : ordre et regroupement des imports
  "N",   # pep8-naming
  "UP",  # pyupgrade : tournures dépassées pour la version cible
  "B",   # flake8-bugbear : pièges courants, dont les valeurs par défaut mutables
  "SIM", # flake8-simplify
  "DTZ", # flake8-datetimez : datetime sans fuseau, voir plus bas
]

# Une seule règle est désactivée pour tout le dépôt, ci-dessous. Les autres
# exceptions sont bornées à un répertoire. Toutes portent leur motif : une
# exception sans motif est indiscernable d'un oubli six mois plus tard.
ignore = [
  # UP017 remplace `datetime.timezone.utc` par `datetime.UTC`, alias ajouté en
  # 3.11. Les deux sont exacts et équivalents. La règle relève 64 occurrences
  # dans l'ETL, écrites ainsi par quelqu'un qui savait ce qu'il faisait, et les
  # réécrire ferait la moitié du diff d'une pull request de mise en place
  # d'outil pour un gain de goût. `timezone.utc` dit d'ailleurs à la lecture ce
  # que `UTC` laisse deviner.
  #
  # C'est le genre de règle qui apprend à détester les linters, et un linter
  # détesté finit désactivé en entier. Le reste du jeu UP est conservé : il
  # attrape de vraies tournures dépassées, pas des synonymes.
  "UP017",
]

[lint.per-file-ignores]

# Ces générateurs embarquent du HTML, du CSS et du JavaScript dans une chaîne
# multilignes. E501 mesurerait la source embarquée plutôt que la lisibilité du
# Python ; les autres règles restent actives sur ces fichiers.
"apps/etl/insights/build*_html.py" = ["E501"]

# DTZ001 exige un fuseau sur tout `datetime`. La règle vise le code qui écrit ou
# compare des horodatages réels : un décalage y passe inaperçu jusqu'au
# changement d'heure. Un jeu d'essai est autre chose. `datetime(2025, 1, 1, 12)`
# dans un test dit « midi », pas « midi à Paris » : lui imposer un fuseau ajoute
# du bruit à la lecture sans rien vérifier de plus.
#
# L'exception est donc bornée aux répertoires de tests, et à cette seule règle.
# DTZ reste active sur tout le code qui tourne, l'ETL compris, qui écrit les
# horodatages que le modèle relit.
"**/tests/**" = ["DTZ001"]
"**/test/**" = ["DTZ001"]
