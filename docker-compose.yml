# Pile on-premise.
services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # Stockage certificats (persistance entre reboots)
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    networks:
      - frontend
    depends_on:
      - dashboard

  # PostgreSQL nu, sans TimescaleDB : la base ne porte plus les mesures, qui
  # vivent en fichiers Parquet sur le volume partagé. Il ne lui reste que le
  # référentiel des sites, les comptes, les rôles et les périmètres d'accès.
  postgres:
    image: postgres:16-alpine
    container_name: enervision-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-enervision}
      POSTGRES_USER: ${POSTGRES_USER:-enervision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseigner POSTGRES_PASSWORD dans .env}
    # Lié à la boucle locale : pratique pour un client SQL sur son poste,
    # injoignable depuis le réseau. Aucun service interne n'est exposé.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-enervision}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - data

  # Prometheus sert aussi à la dérive du modèle (C24), donc il reste prévu.
  # Commenté plutôt que retiré : le temps de l'activer sur le serveur n'est
  # pas garanti d'ici la fin du POC, et ce n'est pas la priorité. À
  # décommenter (avec le volume prom_data ci-dessous) quand ça le devient.
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: enervision-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prom_data:/prometheus
  #   restart: unless-stopped

  # Pas de restart: ce service ne tourne jamais en continu. Il est déclenché
  # par un cron sur la machine, via `docker compose run --rm etl ...`, ce qui
  # ignore de toute façon la politique de restart. Le profil l'exclut d'un
  # `docker compose up -d` classique : sans lui, le service démarrerait une
  # fois, sortirait aussitôt faute d'argument à main.py, et resterait affiché
  # comme arrêté sans raison apparente.
  etl:
    build: ./apps/etl
    user: "1000:1000"
    profiles: ["cron"]
    environment:
      MOCK_API_URL: ${MOCK_API_URL:?renseigner MOCK_API_URL dans .env}
      PARQUET_DIR: /data
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-enervision}
      # Le rôle etl, et surtout pas le propriétaire de la base : SELECT et
      # INSERT sur la seule table sites, UPDATE sur sept de ses colonnes. Il
      # ne peut lire ni les comptes, ni les sessions, ni les périmètres, et
      # ne peut pas écrire warning_threshold_kw (docs/data.md).
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: ${ETL_DB_PASSWORD:?renseigner ETL_DB_PASSWORD dans .env}
    volumes:
      - ${PARQUET_DIR_HOST:?}:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data

  ml:
    build: ./apps/ml
    environment:
      PARQUET_DIR: /data
    volumes:
      - ${PARQUET_DIR_HOST:?}:/data:ro
    restart: unless-stopped
    networks:
      - data

  dashboard:
    build: ./apps/dashboard
    environment:
      # Les morceaux, comme pour l'ETL : c'est l'applicatif qui assemble son URL.
      # La composition n'a plus à le faire, et le mot de passe n'a plus à être
      # sans caractère spécial, l'assemblage l'encodant (#158).
      NUXT_POSTGRES_HOST: postgres
      NUXT_POSTGRES_PORT: 5432
      NUXT_POSTGRES_DATABASE: ${POSTGRES_DB:-enervision}
      NUXT_POSTGRES_USER: ${POSTGRES_USER:-enervision}
      NUXT_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NUXT_PARQUET_DIR: /data
      NUXT_ML_SERVICE_URL: ${ML_API_URL:-http://ml:8000}
      NUXT_MOCK_API_URL: ${MOCK_API_URL:?renseigner MOCK_API_URL dans .env}
      # Nom neutre en entrée, nom attendu par nuxt-auth-utils en sortie. C'est
      # SESSION_SECRET qu'injecte `sops exec-env` au déploiement : lire ici un
      # NUXT_SESSION_SECRET aurait fait échouer le lancement sur la machine.
      NUXT_SESSION_PASSWORD: ${SESSION_SECRET:?renseigner SESSION_SECRET dans .env ou par sops}
      NUXT_TRUST_PROXY: ${TRUST_PROXY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ${PARQUET_DIR_HOST:?}:/data:ro       # lecture seule, et rien d'autre que l'exposé
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - frontend
      - data

networks:
  frontend: # proxy <-> dashboard
  data: # dashboard <-> postgres / ml / etl

volumes:
  db_data:
  # prom_data: décommenter avec le service prometheus ci-dessus.
  caddy_data:
  caddy_config:
