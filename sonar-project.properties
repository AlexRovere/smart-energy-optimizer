# Analyse SonarCloud lancée par le job sonarcloud de ci.yml. L'analyse
# automatique doit rester désactivée côté SonarCloud : elle ne sait pas importer
# de couverture, et SonarCloud refuse l'analyse de la CI tant qu'elle est active.
sonar.organization=alex-rovere-dev-sec-ops
sonar.projectKey=AlexRovere_smart-energy-optimizer

sonar.sources=apps
sonar.tests=apps
sonar.test.inclusions=apps/etl/test/**,apps/ml/tests/**,apps/mock-api/tests/**,apps/dashboard/tests/**
# Les notebooks gardent la trace du raisonnement, pas du code livré : ce qui en
# sort est repris dans apps/ml/src (voir docs/ci-cd.md).
sonar.exclusions=apps/etl/test/**,apps/ml/tests/**,apps/mock-api/tests/**,apps/dashboard/tests/**,apps/ml/notebooks/**,**/node_modules/**

sonar.python.version=3.12

# Rapports produits par les jobs de test, récupérés comme artefacts dans
# couverture/<nom de l'artefact>/ par le job sonarcloud.
sonar.python.coverage.reportPaths=couverture/couverture-etl/coverage.xml,couverture/couverture-ml/coverage.xml,couverture/couverture-mock-api/coverage.xml
sonar.javascript.lcov.reportPaths=couverture/couverture-dashboard/lcov.info
