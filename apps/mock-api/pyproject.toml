[project]
name = "mock-api"
version = "0.1.0"
description = "Simulateur de l'API Mock de la formation : même contrat, données plausibles et déterministes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx2>=0.1.0",
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mock_api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
