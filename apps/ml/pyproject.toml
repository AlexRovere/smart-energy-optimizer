[project]
name = "ml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "catboost>=1.2.10",
    "duckdb>=1.5.5",
    "fastapi>=0.116.0",
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "mlflow>=2.22.0",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "prophet>=1.4.0",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "tornado<6.5.9",
    "uvicorn>=0.35.0",
]

[project.scripts]
ml-api = "api.main:run"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["api", "data", "env_loader", "features", "models", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
